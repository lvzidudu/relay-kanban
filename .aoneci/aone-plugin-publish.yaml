name: Aone Open Plugin 发布

params:
  plugin:
    type: string
    default: "relay-kanban"
  packageName:
    type: string
    default: "relay-kanban"
  mode:
    type: string
    default: "standard"
    options: [ "standard", "simple" ]
  skillNames:
    type: string
    default: "[]"
  version:
    type: string
    required: true
  tag:
    type: string
    default: "latest"
    options: [ "beta", "latest" ]
  token:
    type: string
    required: true
    sensitive: true
  env:
    type: string
    default: "prod"
    options: [ "daily", "pre", "prod" ]
  changelog:
    type: string
    default: ""
  config:
    type: string
    default: "{}"

jobs:
  publish:
    name: 发布 Plugin Package
    steps:
      - uses: checkout
      - uses: setup-env
        inputs:
          node-version: 18 # 或者更高版本
      - uses: aone-plugin-publish
        inputs:
          path: "."
          plugin: $params.plugin
          packageName: $params.packageName
          mode: $params.mode
          skillNames: $params.skillNames
          version: $params.version
          tag: $params.tag
          token: $params.token
          env: $params.env
          changelog: $params.changelog
          config: $params.config
